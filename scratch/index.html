<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Scratch 3.0 GUI</title>
  <style>
    .sc-user-wrap{position:relative;display:inline-flex;align-items:center;margin-left:12px;}
    .sc-user-trigger{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;user-select:none;background:rgba(255,255,255,.2);border:none;border-radius:16px;transition:all .2s;text-decoration:none;}
    .sc-user-trigger:hover{background:rgba(255,255,255,.3);}
    .sc-user-trigger.open{background:rgba(255,255,255,.25);}
    .sc-avatar{width:24px;height:24px;background:linear-gradient(135deg,#6366f1,#a78bfa);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;line-height:24px;}
    .sc-user-name{font-size:12px;font-weight:600;color:#fff;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
    .sc-user-arrow{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex-shrink:0;}
    .sc-user-trigger.open .sc-user-arrow{transform:rotate(180deg);}
    .sc-dropdown{display:none;position:absolute;top:calc(100% + 10px);right:0;width:200px;z-index:10000;}
    .sc-dropdown.show{display:block;}
    .sc-dd-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);}
    .sc-dd-top{padding:16px 18px;border-bottom:1px solid #f3f4f6;}
    .sc-dd-top .dd-name{font-size:15px;font-weight:700;color:#111827;line-height:1.3;}
    .sc-dd-top .dd-role{font-size:12px;color:#9ca3af;margin-top:3px;}
    .sc-dd-list{padding:6px 0;}
    .sc-dd-item{display:block;padding:10px 18px;font-size:14px;color:#374151;text-decoration:none;cursor:pointer;transition:background .1s;}
    .sc-dd-item:hover{background:#f9fafb;color:#111827;}
    .sc-dd-divider{height:1px;background:#f3f4f6;margin:0;}
    .sc-dd-item.logout{color:#dc2626;}
    .sc-dd-item.logout:hover{background:#fef2f2;}
  </style>
  <script>
    window.scratchConfig = {
      logo: {
        show: true
        , url: "../scratch/logo.png"
        , handleClickLogo: () => {
          console.log('点击LOGO')
        }
      }, 
      menuBar: {
        color: 'hsla(215, 100%, 65%, 1)'
      }, 
      shareButton: {
        show: true,
        buttonName: "分享",
        handleClick: () => {
          //点击分享按钮
          var projectName = window.scratch.getProjectName() || '我的作品';
          window.scratch.getProjectFile(file => {
            if (file) {
              try {
                var blob = new Blob([file], { type: 'application/octet-stream' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = projectName + '.sb3';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('作品"' + projectName + '"已保存！');
              } catch (e) {
                console.error('保存失败', e);
                alert('保存失败，请重试！');
              }
            } else {
              alert('获取项目文件失败，请重试！');
            }
          });
        }
      },
      profileButton: {
        show: true,
        buttonName: "我的作品",
        handleClick:()=>{
          window.location.href = '../student/mywork.aspx';
        }
      },
      handleVmInitialized: (vm) => {
        window.vm = vm
        console.log("VM初始化完毕")
        setTimeout(function(){ loadAndInsertUserInfo(); }, 500);
      },
      handleProjectLoaded:() => {
        console.log("作品载入完毕")

      },
      handleDefaultProjectLoaded:() => {
        //默认作品加载完毕，一般在这里控制项目加载
        window.scratch.setProjectName("默认项目")
        //  window.scratch.loadProject("/project.sb3", () => { 
        //     console.log("项目加载完毕")
        //     window.scratch.setProjectName("默认项目")
        //  })
      },
      //若使用官方素材库请删除本配置项
     // assetCDN: 'http://scratch.qiniu.xxx.com' 
    }


  </script>
</head>

<body>
  <div id="scratch">
    
  </div>
<script type="text/javascript" src="../scratch/lib.min.js"></script>
<script type="text/javascript" src="../scratch/chunks/gui.js"></script>

</body>
<script>
// ===== 用户信息模块 =====
function loadAndInsertUserInfo() {
  if (document.getElementById('scUserWrap')) return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '../scratch/userinfo.aspx?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.loggedIn) {
          insertUserUI(data.name, data['class'] || '', data.role || '');
        }
      } catch(e) { console.log('userinfo parse error', e); }
    }
  };
  xhr.send();
}

function insertUserUI(name, cls, role) {
  if (document.getElementById('scUserWrap')) return;
  var menuBar = document.querySelector('[class*="menu-bar"]') ||
                document.querySelector('[class*="menuBar"]');
  if (!menuBar) {
    if (!window._scUserRetry) window._scUserRetry = 0;
    if (window._scUserRetry < 10) {
      window._scUserRetry++;
      setTimeout(function(){ insertUserUI(name, cls, role); }, 500);
    }
    return;
  }
  var initial = name.charAt(0);
  var roleLabel = role === 'teacher' ? '教师' : role === 'manager' ? '管理员' : (cls || '学生');
  var html =
    '<div class="sc-user-wrap" id="scUserWrap">' +
      '<div class="sc-user-trigger" id="scUserTrigger" onclick="toggleScUser()">' +
        '<div class="sc-avatar">' + initial + '</div>' +
        '<span class="sc-user-name">' + name + '</span>' +
        '<svg class="sc-user-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</div>' +
      '<div class="sc-dropdown" id="scDropdown">' +
        '<div class="sc-dd-card">' +
          '<div class="sc-dd-top">' +
            '<div class="dd-name">' + name + '</div>' +
            '<div class="dd-role">' + roleLabel + '</div>' +
          '</div>' +
          '<div class="sc-dd-list">' +
            '<a href="../profile/mygroup.aspx" class="sc-dd-item">我的小组</a>' +
            '<a href="../profile/mypwd.aspx" class="sc-dd-item">修改密码</a>' +
            '<a href="../profile/myphoto.aspx" class="sc-dd-item">修改头像</a>' +
          '</div>' +
          '<div class="sc-dd-divider"></div>' +
          '<div class="sc-dd-list">' +
            '<a href="javascript:void(0)" class="sc-dd-item logout" onclick="scLogout()">退出登录</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var el = tmp.firstChild;

  // 尝试插入到菜单栏右侧
  var rightArea = menuBar.querySelector('[class*="account"]') ||
                  menuBar.querySelector('[class*="right"]') ||
                  menuBar;
  rightArea.appendChild(el);
}

function toggleScUser() {
  var t = document.getElementById('scUserTrigger');
  var d = document.getElementById('scDropdown');
  if (t && d) { t.classList.toggle('open'); d.classList.toggle('show'); }
}
document.addEventListener('click', function(e) {
  var w = document.getElementById('scUserWrap');
  if (w && !w.contains(e.target)) {
    var t = document.getElementById('scUserTrigger');
    var d = document.getElementById('scDropdown');
    if (t) t.classList.remove('open');
    if (d) d.classList.remove('show');
  }
});
function scLogout() {
  window.location.href = '../student/myinfo.aspx?logout=1';
}
</script>

</html>
