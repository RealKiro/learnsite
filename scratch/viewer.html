<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Scratch 作品查看器</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #scratch { width: 100%; height: 100vh; }
  </style>
  <script>
    // 从URL获取项目路径
    function getProjectUrl() {
      var params = new URLSearchParams(window.location.search);
      return params.get('project') || '';
    }

    window.scratchConfig = {
      logo: {
        show: true,
        url: "../scratch/logo.png",
        handleClickLogo: () => {
          console.log('点击LOGO')
        }
      }, 
      menuBar: {
        color: 'hsla(215, 100%, 65%, 1)'
      },
      shareButton: {
        show: false
      },
      profileButton: {
        show: false
      },
      handleVmInitialized: (vm) => {
        window.vm = vm;
        console.log("VM初始化完毕");
      },
      handleProjectLoaded: () => {
        console.log("作品载入完毕");
      },
      handleDefaultProjectLoaded: () => {
        // 加载URL指定的项目
        var projectUrl = getProjectUrl();
        if (projectUrl) {
          console.log("正在加载项目:", projectUrl);
          window.scratch.loadProject(projectUrl, () => { 
            console.log("项目加载完毕");
            window.scratch.setProjectName("学生作品");
          });
        } else {
          console.log("未指定项目URL");
          window.scratch.setProjectName("默认项目");
        }
      }
    }
  </script>
</head>
<body>
  <div id="scratch"></div>
  <script type="text/javascript" src="../scratch/lib.min.js"></script>
  <script type="text/javascript" src="../scratch/chunks/gui.js"></script>
</body>
</html>
