<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- 顶部光泽 -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>
  <!-- 翻开的书本 - 左页 -->
  <path d="M7 22 L7 11 Q7 10 8 10 L15 10 Q16 10 16 11 L16 22" fill="white" fill-opacity="0.95"/>
  <!-- 翻开的书本 - 右页 -->
  <path d="M16 22 L16 11 Q16 10 17 10 L24 10 Q25 10 25 11 L25 22" fill="white" fill-opacity="0.85"/>
  <!-- 书脊 -->
  <line x1="16" y1="10" x2="16" y2="22" stroke="#4f46e5" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 左页文字线条 -->
  <rect x="9" y="13" width="5" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.4"/>
  <rect x="9" y="15.5" width="4" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.3"/>
  <rect x="9" y="18" width="5.5" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.25"/>
  <!-- 右页文字线条 -->
  <rect x="18" y="13" width="5" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.35"/>
  <rect x="18" y="15.5" width="4.5" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.25"/>
  <rect x="18" y="18" width="4" height="1" rx="0.5" fill="#6366f1" fill-opacity="0.2"/>
  <!-- 知识光芒/星星 -->
  <circle cx="22" cy="8" r="1.5" fill="#fbbf24" fill-opacity="0.9"/>
  <line x1="22" y1="5" x2="22" y2="5.8" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="24.5" y1="8" x2="23.8" y2="8" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="22" y1="11" x2="22" y2="10.2" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- 底部装饰弧线 -->
  <path d="M8 23.5 Q16 25.5 24 23.5" stroke="white" stroke-width="0.8" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
</svg>
