<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试复选框显示</title>
    <style>
        body {
            font-family: 'Microsoft YaHei';
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
        }
        .question-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #10b981;
        }
    </style>
</head>
<body>
    <h1>复选框显示测试</h1>
    
    <p>如果你能看到下面表格中的复选框，说明浏览器支持复选框显示。</p>
    
    <table>
        <thead>
            <tr>
                <th style="width: 50px;">☑</th>
                <th style="width: 60px;">序号</th>
                <th>题目</th>
                <th style="width: 100px;">操作</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="text-align: center;">
                    <input type="checkbox" class="question-checkbox" data-qid="1" />
                </td>
                <td>1</td>
                <td>测试题目1</td>
                <td>删除</td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    <input type="checkbox" class="question-checkbox" data-qid="2" />
                </td>
                <td>2</td>
                <td>测试题目2</td>
                <td>删除</td>
            </tr>
            <tr>
                <td style="text-align: center;">
                    <input type="checkbox" class="question-checkbox" data-qid="3" />
                </td>
                <td>3</td>
                <td>测试题目3</td>
                <td>删除</td>
            </tr>
        </tbody>
    </table>
    
    <h2>ASP.NET TemplateField 测试</h2>
    <p>下面是模拟ASP.NET GridView TemplateField的HTML：</p>
    
    <table>
        <thead>
            <tr>
                <th style="width: 50px;">☑</th>
                <th>内容</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">
                    <input type="checkbox" class="question-checkbox" data-qid="100" onclick="alert('Clicked: ' + this.getAttribute('data-qid'))" />
                </td>
                <td>点击复选框应该弹出提示</td>
            </tr>
        </tbody>
    </table>
    
    <h2>调试信息</h2>
    <div id="debug"></div>
    
    <script>
        // 检查复选框是否存在
        var checkboxes = document.querySelectorAll('.question-checkbox');
        var debugDiv = document.getElementById('debug');
        debugDiv.innerHTML = '<p>找到 ' + checkboxes.length + ' 个复选框</p>';
        
        checkboxes.forEach(function(cb, index) {
            debugDiv.innerHTML += '<p>复选框 ' + (index + 1) + ': data-qid=' + cb.getAttribute('data-qid') + '</p>';
        });
    </script>
</body>
</html>
